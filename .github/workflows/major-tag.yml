# Keeps the moving major tag (v1) on the newest v1.x release, so users of @v1 always get fixes.
name: move major tag
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  tag:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_REF_NAME"
          git push -f origin "$MAJOR"
